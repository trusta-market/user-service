server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ${SPRING_APPLICATION_NAME:user-service}
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  # 데이터베이스 설정 (.env 또는 시스템 환경변수로 재정의 가능)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trusta_market}
    username: ${DB_USERNAME:trusta_admin}
    password: ${DB_PASSWORD:trusta_admin_pw}
    driver-class-name: org.postgresql.Driver

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        dialect: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  # Security (Keycloak 연동) 설정
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9090/realms/trusta}

trusta:
  security:
    trust-gateway-headers: ${TRUST_GATEWAY_HEADERS:true}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:9090}
    realm: ${KEYCLOAK_REALM:trusta}
    client-id: ${KEYCLOAK_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_USERNAME:admin}
    password: ${KEYCLOAK_PASSWORD:admin}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
