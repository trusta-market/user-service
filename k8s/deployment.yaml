apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      # SA 토큰 자동 마운트 차단 — Pod 가 K8s API 접근 안 함 (도메인 서비스라 불필요).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # seccomp: 컨테이너 안에서 시스템 콜 화이트리스트 적용 (RuntimeDefault = runtime 권장).
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: user-service
          image: asia-northeast3-docker.pkg.dev/trusta-market-id/trusta-registry-services/user-service:PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: domain-postgres-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: domain-postgres-secrets
                  key: DB_PASSWORD
            # Keycloak Admin API 호출용 비밀번호 (keycloak-secrets 와 동일)
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
          # request 는 실 사용량 기반 (CPU ~25m, memory ~400Mi, burst 여유 포함).
          # limit 은 thread 800 stack (~800MB) + heap (limit*25%=500MB) + 기타 = ~1.5GB 안에 맞춤.
          # request 줄임 → 노드당 pod 수 증가 → HPA scale 자리 확보 (e2-medium 4Gi 노드 기준 3 pod/노드).
          resources:
            requests:
              cpu: 100m
              memory: 800Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
